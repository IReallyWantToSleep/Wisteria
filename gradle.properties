org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
group=org.ireallywanttosleep
mod_id=wisteria
mod_name=Wisteria
mod_version=0.1.0-alpha.1
mod_license=GPL-3.0-or-later
mod_authors=IReallyWantToSleep

# Everything Minecraft-version specific lives in versions/<id>.properties.
# Select one with -Pmc=<id>; the default is set in settings.gradle.kts.

# Super Resolution's API, compiled against but never bundled: the SR mod supplies these
# classes at runtime.
#
# One coordinate covers every Minecraft version: the API's public signatures are identical
# across them, and the few Minecraft types they name (Component) keep the same package on
# every version. SR builds the artifact from its 1.21.1 configuration, so the class files
# stay readable by both Java 21 and Java 25.
#
# To work against unpublished API changes, run publishToMavenLocal in the SR project and
# set sr_version to that build; mavenLocal() is searched first.
sr_group=io.homo.superresolution
sr_api_module=superresolution-api
sr_version=0.9.0-alpha.1-SNAPSHOT

# Super Resolution's mod id, used to declare the runtime dependency in the loader
# metadata. Unrelated to the Maven coordinate above.
sr_mod_id=super_resolution
