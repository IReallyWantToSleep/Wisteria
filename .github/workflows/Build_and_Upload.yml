name: Build and Upload Artifacts

on:
  workflow_dispatch:
    inputs:
      name:
        description: "name"
        required: true
      tag_name:
        description: "tag_name"
        required: true

env:
  # NVIDIA Streamline SDK release supplying the runtime DLLs that common/build.gradle.kts
  # syncs into the jar. Bump here; the cache key follows.
  STREAMLINE_VERSION: v2.12.0

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Streamline runtime
        id: streamline-cache
        uses: actions/cache@v4
        with:
          path: streamline/bin/x64
          key: streamline-${{ env.STREAMLINE_VERSION }}

      - name: Download Streamline SDK
        if: steps.streamline-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$STREAMLINE_VERSION" -R NVIDIA-RTX/Streamline \
            --pattern 'streamline-sdk-*.zip' --output /tmp/streamline-sdk.zip --clobber
          # Top-level bin/x64 only: development/ holds the much larger debug variants of the
          # same DLLs, which are never shipped.
          unzip -q /tmp/streamline-sdk.zip 'bin/x64/*' -x 'bin/x64/development/*' -d streamline
          rm /tmp/streamline-sdk.zip

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        env:
          # buildAllVersions runs each Minecraft version as a nested GradleBuild, and those
          # inherit the environment but not -P properties from the outer command line.
          ORG_GRADLE_PROJECT_streamline_bin_dir: ${{ github.workspace }}/streamline/bin/x64
        # Unlike the push build, a partial result is not publishable: a release missing a
        # loader or a Minecraft version is worse than no release, so this failing stops here.
        run: ./gradlew buildAllVersions

      - name: Find latest changelog
        id: changelog
        run: echo "LATEST_CHANGELOG=$(python3 .github/scripts/find_latest_changelog.py changelogs)" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.name }}
          tag_name: ${{ github.event.inputs.tag_name }}
          # Super Resolution releases with a PAT so the release event can trigger other
          # workflows. Wisteria has no such secret yet, so fall back to the job token.
          token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          body_path: ./changelogs/${{ steps.changelog.outputs.LATEST_CHANGELOG }}
          files: |
            ./build_jars/**
            ./changelogs/${{ steps.changelog.outputs.LATEST_CHANGELOG }}